<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>TinyCub — Brand Tracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:ital,wght@0,400;0,600;0,700;0,800;1,600&display=swap" rel="stylesheet" />
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,
body,
#root {
  width: 100%;
  height: 100%;
  margin: 0;
  padding: 0;
}

body {
  background: #ffffff;
  font-family: 'Nunito', -apple-system, system-ui, sans-serif;
}
  .tc-card {
    background: #ffffff;
    border-radius: 20px;
    padding: 16px;
    border: 1px solid #EFEBE2;
    box-shadow: 0 1px 2px rgba(70,58,35,0.05), 0 8px 22px rgba(90,76,45,0.07);
  }
  .tc-scroll::-webkit-scrollbar { width: 0; height: 0; }
  .tc-scroll { scrollbar-width: none; }
  .tc-press { transition: transform .12s ease, filter .12s ease; }
  .tc-press:active { transform: scale(0.97); filter: brightness(0.98); }
  button { font-family: 'Nunito', sans-serif; }
  textarea, input { font-family: 'Nunito', sans-serif; }
  input::placeholder, textarea::placeholder { color: #C4BBA8; font-weight: 500; }
  @keyframes tcspin { to { transform: rotate(360deg); } }
  @keyframes tcslideup { from { transform: translateY(100%); } to { transform: translateY(0); } }
  div::-webkit-scrollbar { height: 0; width: 0; }
</style>
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
 
<!-- starters -->
<script type="text/babel" src="ios-frame.jsx"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>

<script type="text/babel" src="mascot.jsx"></script>
<script type="text/babel" src="store.jsx"></script>
<!-- features -->

</html>
